syntax = "proto3";

package playbridge;

option go_package = "github.com/playbridgeapp/playbridge/protocol/generated/go/playbridge";

// ==================== Envelope ====================

// Top-level WebSocket frame. Consumers switch on `type`, then `action`.
message MessageEnvelope {
  string type = 1;
  optional string action = 2;
  optional string state = 3;
  optional int64 position = 4;
  optional int64 duration = 5;
  optional string title = 6;
  optional string media_kind = 7 [json_name = "mediaKind"];
  optional string request_id = 8 [json_name = "requestId"];
}

// ==================== Shared Metadata ====================

message SeriesEpisodeRef {
  int32 season = 1;
  int32 episode = 2;
  optional string title = 3;
}

message VisualMetadata {
  string title = 1;
  optional string year = 2;
  optional string rating = 3;
  optional string runtime = 4;
  optional string overview = 5;
  repeated string genres = 6;
  repeated string cast = 7;
  repeated string director = 8;
  optional string backdrop_url = 9  [json_name = "backdropUrl"];
  optional string poster_url = 10   [json_name = "posterUrl"];
  optional string logo_url = 11     [json_name = "logoUrl"];
  optional int32 season = 12;
  optional int32 episode = 13;
  optional string episode_title = 14 [json_name = "episodeTitle"];
  optional string imdb_id = 15       [json_name = "imdbId"];
  optional string tmdb_id = 16       [json_name = "tmdbId"];
  optional string artist = 17;
  optional string album = 18;
  optional string album_artist = 19   [json_name = "albumArtist"];
  optional string artwork_url = 20    [json_name = "artworkUrl"];
  optional int32 track_number = 21    [json_name = "trackNumber"];
}

// ==================== Command Payloads (Phone → TV) ====================

// A sidecar subtitle is an independent network resource. Its headers are scoped
// to this URL's origin and must never be inherited from an unrelated media URL.
message SubtitleResource {
  string url = 1;
  map<string, string> headers = 2;
  optional string label = 3;
  optional string language = 4;
}

// Nonsecret item identity for generic progress callbacks.
message ProgressIdentity {
  string type = 1;
  string content_id = 2 [json_name = "contentId"];
  string video_id = 3 [json_name = "videoId"];
  optional int32 season = 4;
  optional int32 episode = 5;
}

// Session-only credentials: NEVER persist, log, or echo in status/history.
message ProgressWebhook {
  string url = 1;
  string bearer_token = 2 [json_name = "bearerToken"];
}

message PlayPayload {
  string url = 1;
  optional string title = 2;
  map<string, string> headers = 3;
  optional string content_type = 4            [json_name = "contentType"];
  repeated string subtitles = 5;
  optional string detected_by = 6             [json_name = "detectedBy"];
  optional string player_mode = 7             [json_name = "playerMode"];
  optional string preferred_audio_language = 8   [json_name = "preferredAudioLanguage"];
  optional string preferred_subtitle_language = 9 [json_name = "preferredSubtitleLanguage"];
  optional string default_video_quality = 10  [json_name = "defaultVideoQuality"];
  optional double max_bitrate_cap_mbps = 11   [json_name = "maxBitrateCapMbps"];
  optional VisualMetadata visual_metadata = 12 [json_name = "visualMetadata"];
  // Stremio bingeGroup of the chosen stream. Echoed back by the TV in playlist_status so the
  // phone can (a) keep the same release across episodes and (b) recognise its own lazy-queued
  // series to resume queueing after an app restart (no phone-side persistence).
  optional string binge_group = 13            [json_name = "bingeGroup"];
  // Resume point: start playback at this position (ms). The phone seeds it from its
  // content-keyed resume store; the receiver maps it onto the player's start position.
  optional int64 start_position_ms = 14       [json_name = "startPositionMs"];
  // Exact private/LAN origins approved by the sender for page-initiated media.
  // Receivers must still validate every resolved address, redirect, and derived resource.
  repeated string allowed_private_origins = 15 [json_name = "allowedPrivateOrigins"];
  // Additive replacement for credentialed sidecars. Legacy `subtitles` remains
  // supported for senders that only provide URLs.
  repeated SubtitleResource subtitle_resources = 16 [json_name = "subtitleResources"];
  // Per-item presentation kind. Omitted means the receiver should infer it.
  optional string media_kind = 17 [json_name = "mediaKind"];
  // For image items only. Positive values auto-advance after this display time;
  // omitted or zero keeps the image visible until explicit navigation.
  optional int64 display_duration_ms = 18 [json_name = "displayDurationMs"];
  // Do not persist receiver history, resume progress, or captured history artwork.
  optional bool skip_history = 19 [json_name = "skipHistory"];
  // Stable receiver queue identity. Receivers assign one when omitted.
  optional string item_id = 20 [json_name = "itemId"];
  optional ProgressIdentity progress_identity = 21 [json_name = "progressIdentity"];
}

message PlaylistPayload {
  repeated PlayPayload items = 1;
  int32 start_index = 2               [json_name = "startIndex"];
  optional VisualMetadata visual_metadata = 3 [json_name = "visualMetadata"];
  // Presentation hint for receivers that normally show a metadata-rich pre-play screen.
  // Metadata remains available for playback controls and history when this is true.
  optional bool skip_preplay = 4      [json_name = "skipPreplay"];
  optional ProgressWebhook progress_webhook = 5 [json_name = "progressWebhook"];
}

message QueueAddPayload {
  PlayPayload item = 1;
  repeated PlayPayload items = 2;
  optional string if_playback_id = 3 [json_name = "ifPlaybackId"];
}

message PlaylistJumpPayload {
  int32 index = 1;
  optional string item_id = 2 [json_name = "itemId"];
  optional string if_playback_id = 3 [json_name = "ifPlaybackId"];
}

message QueueRemovePayload {
  repeated string item_ids = 1 [json_name = "itemIds"];
  optional string if_playback_id = 2 [json_name = "ifPlaybackId"];
}

message QueueMovePayload {
  string item_id = 1 [json_name = "itemId"];
  optional string before_item_id = 2 [json_name = "beforeItemId"];
  optional string if_playback_id = 3 [json_name = "ifPlaybackId"];
}

message QueueClearPayload {
  optional string if_playback_id = 1 [json_name = "ifPlaybackId"];
}

message BrowserPayload {
  string url = 1;
  optional string browser_mode = 2  [json_name = "browserMode"];
  optional bool desktop_mode = 3    [json_name = "desktopMode"];
}

message ControlPayload {
  // pause | play | seek | stop
  string command = 1;
  // Used by add_subtitle for late sidecar attachment without reloading playback.
  optional SubtitleResource subtitle_resource = 2 [json_name = "subtitleResource"];
}

message RemotePayload {
  // dpad_up | dpad_down | dpad_left | dpad_right | dpad_center | back
  string key = 1;
}

message MousePayload {
  // move | click | scroll | down | up
  string event = 1;
  float dx = 2;
  float dy = 3;
}

message BrowserControlPayload {
  // refresh | toggle_ublock
  string action = 1;
}

// ==================== Status Messages (TV → Phone) ====================

message StatusMessage {
  string type = 1;
  string state = 2;
  int64 position = 3;
  int64 duration = 4;
  optional string title = 5;
  optional string media_kind = 6 [json_name = "mediaKind"];
  optional string playback_id = 7 [json_name = "playbackId"];
  optional string current_item_id = 8 [json_name = "currentItemId"];
  // Native browser fullscreen. Omitted by the player and by older receivers.
  optional bool fullscreen = 9;
  // Short user-safe failure reason for state=error; never raw exception/URL text.
  optional string error = 10;
}

// Complete player_settings helper. On WSS, type/speed/scaling/audioBoost/
// subtitleOffsetMs/engine remain required. Unsupported controls use neutral
// values with honest availability flags; active loop/engine stay in state.
message PlayerSettingsMessage {
  string type = 1;
  optional bool loop = 2;
  optional double speed = 3;
  optional string scaling = 4;
  optional bool audio_boost = 5 [json_name = "audioBoost"];
  optional int64 subtitle_offset_ms = 6 [json_name = "subtitleOffsetMs"];
  optional string engine = 7;
  optional int32 quality_max_height = 8 [json_name = "qualityMaxHeight"];
  optional int32 current_video_height = 9 [json_name = "currentVideoHeight"];
  optional bool is_live = 10 [json_name = "isLive"];
  optional bool is_seekable = 11 [json_name = "isSeekable"];
  optional bool speed_available = 12 [json_name = "speedAvailable"];
  optional bool scaling_available = 13 [json_name = "scalingAvailable"];
  optional bool audio_boost_available = 14 [json_name = "audioBoostAvailable"];
  optional bool quality_available = 15 [json_name = "qualityAvailable"];
  optional bool subtitle_offset_available = 16 [json_name = "subtitleOffsetAvailable"];
  optional bool engine_available = 17 [json_name = "engineAvailable"];
  optional bool loop_available = 18 [json_name = "loopAvailable"];
}

message ContextMessage {
  string type = 1;
  // player | browser | idle
  string active = 2;
  optional string engine = 3;
}

message PlaylistItemInfo {
  int32 index = 1;
  string title = 2;
  optional string media_kind = 3 [json_name = "mediaKind"];
  optional string item_id = 4 [json_name = "itemId"];
  optional int32 season = 5;
  optional int32 episode = 6;
  optional string imdb_id = 7 [json_name = "imdbId"];
  optional string tmdb_id = 8 [json_name = "tmdbId"];
  optional string binge_group = 9 [json_name = "bingeGroup"];
}

message PlaylistStatusMessage {
  string type = 1                           [json_name = "type"];
  repeated PlaylistItemInfo items = 2;
  int32 current_index = 3                   [json_name = "currentIndex"];
  int32 total_count = 4                     [json_name = "totalCount"];
  optional string playback_id = 5 [json_name = "playbackId"];
  int64 queue_revision = 6 [json_name = "queueRevision"];
  optional string current_item_id = 7 [json_name = "currentItemId"];
}

message CommandResultMessage {
  string type = 1;
  string request_id = 2 [json_name = "requestId"];
  bool ok = 3;
  optional string error = 4;
  optional string message = 5;
  optional string playback_id = 6 [json_name = "playbackId"];
  optional int64 queue_revision = 7 [json_name = "queueRevision"];
}

// ==================== Auth & Pairing ====================

message AuthMessage {
  string type = 1;
  optional string token = 2;
}

message AuthResponse {
  string type = 1;
  bool success = 2;
  optional string token = 3;
  // Lets the receiver re-assert (or rotate) its SPKI pin on reconnect. Same
  // format as PairingApprovedMessage.cert_fingerprint. Optional during rollout.
  optional string cert_fingerprint = 4 [json_name = "certFingerprint"];
  repeated string players = 5;
  repeated string browsers = 6;
  optional bool screen_mirror_web_rtc = 7 [json_name = "screenMirrorWebRtc"];
  repeated string media_kinds = 8 [json_name = "mediaKinds"];
  repeated string features = 9;
  // Optional authenticated descriptor; existing fields and tags stay unchanged.
  ReceiverCapabilities capabilities = 10;
}

// Phone → TV on first connection (no saved token). TV shows Allow/Deny prompt.
message PairingRequestMessage {
  string type = 1;
  string device_name = 2 [json_name = "deviceName"];
  string device_uuid = 3 [json_name = "deviceUUID"];
}

// SAS Handshake: Step 1 (Sender -> TV Commit)
message PairingCommitMessage {
  string type = 1;
  string commit = 2;
  string device_name = 3 [json_name = "deviceName"];
  string device_uuid = 4 [json_name = "deviceUUID"];
}

// SAS Handshake: Step 2 (TV -> Sender Challenge)
message PairingChallengeMessage {
  string type = 1;
  string tv_eph_pub = 2 [json_name = "tvEphPub"];
  string nonce_t = 3 [json_name = "nonceT"];
}

// SAS Handshake: Step 3 (Sender -> TV Reveal)
message PairingRevealMessage {
  string type = 1;
  string sender_eph_pub = 2 [json_name = "senderEphPub"];
  string nonce_s = 3 [json_name = "nonceS"];
}

// SAS Handshake: Step 4 (Sender -> TV Confirmation)
message PairingConfirmationMessage {
  string type = 1;
  string mac = 2;
}

// TV → Phone: user tapped Allow.
message PairingApprovedMessage {
  string type = 1;
  string token = 2;
  // SPKI pin of the receiver's self-signed TLS cert, format "sha256/<base64>"
  // (SHA-256 of the DER-encoded SubjectPublicKeyInfo — same scheme as OkHttp's
  // CertificatePinner). The sender stores this alongside the token at pairing
  // and validates it on every wss:// connection (TOFU pinning). Optional during
  // rollout: absent until receivers terminate TLS.
  optional string cert_fingerprint = 3 [json_name = "certFingerprint"];
}

// TV → Phone: user tapped Deny or 30s timeout elapsed.
message PairingDeniedMessage {
  string type = 1;
}

// ==================== Heartbeat ====================

message PingMessage {
  string type = 1;
}

message PongMessage {
  string type = 1;
}

// ==================== Binary Mouse Packet ====================
// High-frequency mouse events skip JSON and use a compact 9-byte frame:
//   [0]   MouseEventType (uint8)
//   [1-4] dx as float32 big-endian
//   [5-8] dy as float32 big-endian
// This message is for documentation/tooling only — not sent via protobuf encoding.
enum MouseEventType {
  MOUSE_MOVE   = 0;
  MOUSE_CLICK  = 1;
  MOUSE_SCROLL = 2;
  MOUSE_DOWN   = 3;
  MOUSE_UP     = 4;
  MOUSE_ZOOM   = 5;
  MOUSE_RESET  = 6;
  MOUSE_ROTATE = 7;
  // dx/dy are normalized viewport coordinates for subsequent zoom/rotation events;
  // negative coordinates clear the touch anchor.
  MOUSE_TRANSFORM_ANCHOR = 8;
}

// ==================== Receiver capabilities v1 ====================
// These are JSON model helpers, not a protobuf WSS transport. Read descriptor
// version from raw JSON first: unknown versions use frozen legacy behavior.
// Never add descriptor plaintext to PairingApprovedMessage or SAS transcript/AAD.
message CredentialBundle {
  string token = 1;
  optional string cert_fingerprint = 2 [json_name = "certFingerprint"];
  repeated string players = 3;
  repeated string browsers = 4;
  optional bool screen_mirror_web_rtc = 5 [json_name = "screenMirrorWebRtc"];
  repeated string media_kinds = 6 [json_name = "mediaKinds"];
  repeated string features = 7;
  ReceiverCapabilities capabilities = 8;
}

message ReceiverCapabilities {
  uint32 version = 1;
  // Single authority; empty/absent engine operation sets are unsupported.
  map<string, ReceiverSurfaceCapabilities> surfaces = 2;
  ReceiverVolumeCapabilities volume = 3;
  ReceiverHostInfo host = 4;
  repeated string companion_hints = 5 [json_name = "companionHints"];
}

message ReceiverSurfaceCapabilities {
  // Presence means available. Active engine belongs to context/player_settings.
  map<string, ReceiverEngineCapabilities> engines = 1;
}

message ReceiverEngineCapabilities {
  repeated string transport = 1;
  repeated string keys = 2;
  repeated string pointer = 3;
  repeated string image_transforms = 4 [json_name = "imageTransforms"];
  repeated string text = 5;
  repeated string settings = 6;
  repeated string tracks = 7;
  repeated string queue = 8;
  repeated string browser = 9;
  repeated string reporting = 10;
}

message ReceiverVolumeCapabilities {
  string scope = 1;
  repeated string operations = 2;
  optional double step = 3;
  optional string fallback_scope = 4 [json_name = "fallbackScope"];
}

message ReceiverHostInfo {
  optional string os_family = 1 [json_name = "osFamily"];
  optional string device_class = 2 [json_name = "deviceClass"];
}

// Native command/volume payload. Scoped absolute level is normalized 0..1.
message VolumePayload {
  string scope = 1;
  optional double level = 2;
}

message VolumeStateMessage {
  string type = 1;
  string scope = 2;
  optional double level = 3;
  optional bool muted = 4;
}
// Native opt-in push, independent of hosted-browser capabilities. JSON adapters
// MUST emit revision as a number (1..2^53-1), not protobuf JSON's uint64 string.
// Select capabilities.version from raw JSON before decoding a future shape.
// Opt in with command/receiver_capabilities_subscribe, payload {}, only after
// receiver_capabilities_v1 appears in authenticated receiver features.
message ReceiverCapabilitiesFrame {
  string type = 1;
  uint64 revision = 2;
  ReceiverCapabilities capabilities = 3;
}
