[package]
name = "stream-proxy-rust"
version = "0.1.1"
edition = "2021"
description = "High-performance PlayBridge streaming proxy server in Rust with MediaFlow AES-256 encryption & stateful sessions"

[features]
default = ["upstream-reqwest", "upstream-avio"]
# HTTP origin fetch via reqwest (Docker, Desktop, CLI).
upstream-reqwest = ["dep:reqwest"]
# Optional FFmpeg AVIO fallback after reqwest failure (needs libavformat at runtime).
upstream-avio = ["upstream-reqwest", "dep:libloading"]
# Host-provided origin fetch (Android JNI → HttpURLConnection). Implemented in PR2+.
upstream-jni = []

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-webpki-roots"], optional = true }
bytes = "1.6"
futures = "0.3"
http-body-util = "0.1"
httpdate = "1"
url = "2.5"
urlencoding = "2.1"
serde_urlencoded = "0.7"
regex = "1.10"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.0"
libloading = { version = "0.8", optional = true }
base64 = "0.22"
rand = "0.8"
mime_guess = "2"

# MediaFlow AES-256 Encryption
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
subtle = "2.6.1"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
# Integration tests always need an HTTP client, even when the library is built
# with only `upstream-jni` (Android feature set).
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-webpki-roots"] }
