[package]
name = "playbridge-cast-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Cross-platform command-line client for PlayBridge Cast Core"

[[bin]]
name = "playbridge-cast"
path = "src/main.rs"

[dependencies]
playbridge-cast-core = { path = "../cast-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2.1"
