[package]
name = "playbridge-cast-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Cross-platform command-line client for PlayBridge Cast Core"

[[bin]]
name = "playbridge"
path = "src/main.rs"

[dependencies]
playbridge-cast-core = { path = "../cast-core" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
axum = "0.8"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
