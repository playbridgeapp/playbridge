services:
  pb-proxy:
    image: ghcr.io/playbridgeapp/playbridge-stream-proxy:latest
    container_name: pb-proxy
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - ADDRESS=0.0.0.0
      - PB_PROXY_PASSWORD=CHANGEME
      # - FFMPEG_PATH=/usr/lib/x86_64-linux-gnu # Auto-detected usually
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
