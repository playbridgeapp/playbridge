<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PlayBridge Browser Receiver</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #05070a; color: #f4f7fb; font: 18px/1.4 system-ui, sans-serif; }
    body { display: grid; place-items: center; overflow: hidden; }
    main { width: min(92vw, 1100px); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 60px); }
    p { color: #aeb8c7; }
    #code { margin: 24px auto; font: 700 clamp(54px, 12vw, 120px)/1 monospace; letter-spacing: .12em; color: #55e6b1; }
    #player-wrap { display: none; position: fixed; inset: 0; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #play-overlay { display: none; position: absolute; inset: 0; place-items: center; background: #000a; border: 0; color: white; font-size: clamp(24px, 5vw, 52px); }
    #status { position: fixed; left: 18px; top: 16px; z-index: 4; padding: 7px 12px; border-radius: 8px; background: #101720cc; color: #d5deea; font-size: 14px; opacity: 1; transition: opacity 220ms ease; }
    #status.hidden { opacity: 0; pointer-events: none; }
    .error { color: #ff8c8c; }
  </style>
</head>
<body>
  <main id="setup">
    <h1>PlayBridge</h1>
    <p id="instructions">Connecting to the sender…</p>
    <div id="code" aria-live="polite"></div>
    <p id="device-name"></p>
  </main>
  <div id="player-wrap">
    <video id="player" controls playsinline></video>
    <button id="play-overlay" type="button">Press to play</button>
  </div>
  <div id="status" role="status" aria-live="polite">Starting…</div>
  <script src="/assets/receiver.js"></script>
</body>
</html>
