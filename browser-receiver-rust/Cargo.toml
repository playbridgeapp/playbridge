[package]
name = "playbridge-browser-receiver"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Sender-hosted web browser receiver service for PlayBridge"

[lib]
name = "playbridge_browser_receiver"

[[bin]]
name = "playbridge-browser-receiver"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6"
futures-util = "0.3"
if-addrs = "0.13"
playbridge-cast-core = { path = "../cast/core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio-tungstenite = "0.28"
