name: Desktop Release Build

# Stage 2: multi-platform packages → draft GitHub Release.
# Stage 3: .github/workflows/desktop_publish.yml

on:
  push:
    branches: [ "main" ]
    paths:
      - 'desktop/**'
      - 'packages/playbridge_cast_core_dart/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'cast/**'
      - 'cli/**'
      - 'protocol/**'
      - '.github/workflows/desktop_build.yml'
  workflow_dispatch:

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/desktop_pr.yml
    with:
      always_run: true

  test-rust:
    name: test-rust
    permissions:
      contents: read
    uses: ./.github/workflows/rust_pr.yml
    with:
      include_cli_builds: false

  build-windows:
    needs: [test, test-rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      shell: bash
      run: |
        if git rev-parse "desktop-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ desktop-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Flutter
      if: steps.check_tag.outputs.skipped == 'false'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        cache: true

    - name: Set up Rust
      if: steps.check_tag.outputs.skipped == 'false'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Install dependencies
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter pub get

    - name: Build bundled helpers (native host + cast)
      if: steps.check_tag.outputs.skipped == 'false'
      shell: bash
      run: bash scripts/build_host.sh

    - name: Build Rust Cast Core
      if: steps.check_tag.outputs.skipped == 'false'
      shell: bash
      run: bash ../cast/build-desktop.sh

    - name: Build Windows
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter build windows --release

    - name: Bundle MSVC runtime DLLs
      if: steps.check_tag.outputs.skipped == 'false'
      shell: pwsh
      run: |
        $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $latest = Get-ChildItem "$vsPath\VC\Redist\MSVC" | Where-Object { $_.Name -match '^\d' } | Sort-Object Name -Descending | Select-Object -First 1
        # Don't hard-code the toolset version (VC143/VC144/...) — pick the newest CRT folder present
        $x64 = Get-ChildItem (Join-Path $latest.FullName "x64") -Filter "Microsoft.VC1*.CRT" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
        if (-not $x64) { throw "No MSVC CRT redist folder found under $($latest.FullName)\x64" }
        Copy-Item "$x64\vcruntime140.dll"   "build\windows\x64\runner\Release\"
        Copy-Item "$x64\vcruntime140_1.dll" "build\windows\x64\runner\Release\"
        Copy-Item "$x64\msvcp140.dll"       "build\windows\x64\runner\Release\"
        Copy-Item "$x64\msvcp140_1.dll"     "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
        Copy-Item "$x64\msvcp140_2.dll"     "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue

    - name: Package Windows artifact
      if: steps.check_tag.outputs.skipped == 'false'
      shell: pwsh
      run: |
        Compress-Archive -Path "build\windows\x64\runner\Release\*" `
          -DestinationPath "playbridge-desktop-windows-${{ steps.version.outputs.version }}.zip"

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      shell: bash
      run: |
        aws s3 cp "playbridge-desktop-windows-${{ steps.version.outputs.version }}.zip" \
          s3://${{ secrets.R2_BUCKET }}/desktop-release/

  build-linux:
    needs: [test, test-rust]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      run: |
        if git rev-parse "desktop-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ desktop-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Install system dependencies
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libgtk-3-dev \
          ninja-build \
          cmake \
          clang \
          pkg-config \
          libmpv-dev \
          liblzma-dev \
          libayatana-appindicator3-dev

    - name: Set up Flutter
      if: steps.check_tag.outputs.skipped == 'false'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        cache: true

    - name: Set up Rust
      if: steps.check_tag.outputs.skipped == 'false'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-gnu

    - name: Install dependencies
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter pub get

    - name: Build bundled helpers (native host + cast)
      if: steps.check_tag.outputs.skipped == 'false'
      shell: bash
      run: bash scripts/build_host.sh

    - name: Build Rust Cast Core
      if: steps.check_tag.outputs.skipped == 'false'
      run: ../cast/build-desktop.sh

    - name: Build Linux
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter build linux --release

    - name: Package Linux artifact
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        tar -czf "playbridge-desktop-linux-${{ steps.version.outputs.version }}.tar.gz" \
          -C build/linux/x64/release bundle

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp "playbridge-desktop-linux-${{ steps.version.outputs.version }}.tar.gz" \
          s3://${{ secrets.R2_BUCKET }}/desktop-release/

  build-macos:
    needs: [test, test-rust]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./desktop
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}
      signed: ${{ steps.sign.outputs.signed }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      run: |
        if git rev-parse "desktop-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ desktop-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Flutter
      if: steps.check_tag.outputs.skipped == 'false'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        cache: true

    - name: Set up Rust
      if: steps.check_tag.outputs.skipped == 'false'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    - name: Install dependencies
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter pub get

    - name: Build bundled helpers (native host + cast)
      if: steps.check_tag.outputs.skipped == 'false'
      shell: bash
      run: bash scripts/build_host.sh

    - name: Build Rust Cast Core
      if: steps.check_tag.outputs.skipped == 'false'
      run: ../cast/build-desktop.sh

    - name: Build macOS
      if: steps.check_tag.outputs.skipped == 'false'
      run: flutter build macos --release

    # Developer ID signing + notarization. Without the certificate secrets (forks)
    # the build stays unsigned. Notarization reuses the App Store Connect API key.
    - name: Sign and notarize macOS app
      id: sign
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      run: |
        set -euo pipefail
        if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
          echo "::warning::macOS signing secrets are not set; the macOS build is unsigned."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        app=build/macos/Build/Products/Release/playbridge_desktop.app

        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password=$(uuidgen)
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
        rm -f "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
        [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }

        bash scripts/sign_macos.sh "$app" "$identity" macos/Runner/Release.entitlements

        key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
        echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
        ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
        auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
        xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" \
          --output-format json > "$RUNNER_TEMP/notary.json"
        submission=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
        echo "Notary submission: $submission"

        # Polling Apple's notary service can drop a single request; retry the wait
        # instead of failing the job and re-uploading.
        status=""
        for attempt in 1 2 3 4 5; do
          xcrun notarytool wait "$submission" "${auth[@]}" --timeout 45m || true
          if xcrun notarytool info "$submission" "${auth[@]}" \
              --output-format json > "$RUNNER_TEMP/notary.json"; then
            status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            [ "$status" != "In Progress" ] && break
          fi
          echo "::warning::Notarization not finished (attempt $attempt, status '${status:-unknown}'); retrying"
          sleep 30
        done
        if [ "$status" != Accepted ]; then
          echo "::error::Notarization status: ${status:-unknown}"
          xcrun notarytool log "$submission" "${auth[@]}" || true
          exit 1
        fi
        xcrun stapler staple "$app"
        spctl --assess --type execute --verbose=2 "$app"
        echo "signed=true" >> "$GITHUB_OUTPUT"

    - name: Remove signing keychain and API key
      if: always() && steps.check_tag.outputs.skipped == 'false'
      run: |
        security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"

    - name: Package macOS artifact
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        cd build/macos/Build/Products/Release
        ditto -c -k --keepParent playbridge_desktop.app \
          "$GITHUB_WORKSPACE/desktop/playbridge-desktop-macos-${{ steps.version.outputs.version }}.zip"

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp "playbridge-desktop-macos-${{ steps.version.outputs.version }}.zip" \
          s3://${{ secrets.R2_BUCKET }}/desktop-release/

  draft-release:
    needs: [build-windows, build-linux, build-macos]
    if: |
      (success() || always()) &&
      needs.build-windows.outputs.skipped == 'false' &&
      needs.build-linux.outputs.skipped == 'false' &&
      needs.build-macos.outputs.skipped == 'false' &&
      needs.build-windows.result != 'failure' &&
      needs.build-linux.result != 'failure' &&
      needs.build-macos.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' desktop/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download artifacts from R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        mkdir -p output
        for artifact in \
          "playbridge-desktop-windows-${{ steps.version.outputs.version }}.zip" \
          "playbridge-desktop-linux-${{ steps.version.outputs.version }}.tar.gz" \
          "playbridge-desktop-macos-${{ steps.version.outputs.version }}.zip"; do
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/desktop-release/$artifact" "output/$artifact"
        done

    - name: Create draft GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: desktop-v${{ steps.version.outputs.version }}
        name: PlayBridge Desktop v${{ steps.version.outputs.version }}
        draft: true
        target_commitish: ${{ github.sha }}
        body: |
          <!-- tag: 1a4b6c -->
          <!-- playbridge-rollout-delay-hours: 24 -->
          **Desktop Receiver:** v${{ steps.version.outputs.version }}

          📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/desktop-v${{ steps.version.outputs.version }}/desktop/CHANGELOG.md)

          | Platform | File |
          |----------|------|
          | Windows 10+ | `playbridge-desktop-windows-${{ steps.version.outputs.version }}.zip` — extract and run `playbridge_desktop.exe` |
          | Linux | `playbridge-desktop-linux-${{ steps.version.outputs.version }}.tar.gz` — extract and run `bundle/playbridge_desktop` |
          | macOS 12+ | `playbridge-desktop-macos-${{ steps.version.outputs.version }}.zip` — extract, move `playbridge_desktop.app` to Applications and open it${{ needs.build-macos.outputs.signed != 'true' && ' (unsigned)' || '' }} |

          **Linux:** requires `libmpv2` (`sudo apt install libmpv2` or `sudo dnf install mpv-libs`).

          ${{ needs.build-macos.outputs.signed == 'true' && '**macOS:** signed with Developer ID and notarized by Apple.' || '**macOS:** unsigned build — Gatekeeper will warn on first launch. Right-click → Open to bypass, or run `xattr -dr com.apple.quarantine playbridge_desktop.app`.' }}
        fail_on_unmatched_files: true
        files: |
          output/playbridge-desktop-windows-${{ steps.version.outputs.version }}.zip
          output/playbridge-desktop-linux-${{ steps.version.outputs.version }}.tar.gz
          output/playbridge-desktop-macos-${{ steps.version.outputs.version }}.zip
        generate_release_notes: false

    - name: Clean up R2 after draft creation
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 rm s3://${{ secrets.R2_BUCKET }}/desktop-release/ --recursive
