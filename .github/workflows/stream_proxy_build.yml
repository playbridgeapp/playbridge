name: Stream Proxy Build & Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'stream-proxy-rust/**'
      - '.github/workflows/stream_proxy_build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-stream-proxy

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' stream-proxy-rust/Cargo.toml | cut -d '"' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag
        id: check_tag
        shell: bash
        run: |
          if git rev-parse "stream-proxy-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "⏭️ stream-proxy-v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push Docker image
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./stream-proxy-rust
          file: ./stream-proxy-rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
