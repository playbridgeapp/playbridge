name: Stream Proxy Build & Publish

# Versioned images come only from release tags. A push to main publishes `edge`
# (plus its commit SHA) and never touches `latest` or a version tag (#487).
on:
  push:
    branches: [ "main" ]
    # Path filters apply to branch pushes only; every release tag is built.
    paths:
      - 'stream-proxy-rust/**'
      - 'cast/net-policy/**'
      - '.github/workflows/stream_proxy_build.yml'
    tags: [ "stream-proxy-v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-stream-proxy

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/stream_proxy_pr.yml
    with:
      always_run: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Choose image tags
        id: release
        shell: bash
        run: |
          VERSION=$(grep '^version =' stream-proxy-rust/Cargo.toml | cut -d '"' -f2 | tr -d '[:space:]')
          if [[ "$GITHUB_REF" == refs/tags/stream-proxy-v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/stream-proxy-v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag stream-proxy-v$TAG_VERSION does not match stream-proxy-rust/Cargo.toml version $VERSION."
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::stream-proxy-v$TAG_VERSION must point at a commit on main."
              exit 1
            fi
            {
              echo "tags<<EOF"
              echo "type=raw,value=$VERSION"
              echo "type=raw,value=latest"
              echo "type=sha,format=long"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Publishing release $VERSION and latest."
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            {
              echo "tags<<EOF"
              echo "type=raw,value=edge"
              echo "type=sha,format=long"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Publishing edge from main (Cargo.toml version $VERSION is not published here)."
          else
            echo "::error::Run this workflow from main or a stream-proxy-v* tag."
            exit 1
          fi

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.release.outputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./stream-proxy-rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
