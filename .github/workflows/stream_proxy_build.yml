name: Stream Proxy Build & Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'stream-proxy-rust/**'
      - '.github/workflows/stream_proxy_build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-stream-proxy

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/stream_proxy_pr.yml
    with:
      always_run: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' stream-proxy-rust/Cargo.toml | cut -d '"' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag
        id: check_tag
        shell: bash
        run: |
          if git rev-parse "stream-proxy-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "⏭️ stream-proxy-v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push Docker image
        if: steps.check_tag.outputs.skipped == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./stream-proxy-rust
          file: ./stream-proxy-rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
