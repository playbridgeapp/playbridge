name: Contributor licence agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

# Serialize writes to the shared signature file, across all PRs.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Same-repository signature branch.
      pull-requests: write  # CLA request/signature comments.
      statuses: write       # Author-only check on the current PR head SHA.
      actions: write        # The pinned action can rerun its earlier failed check.
    steps:
      # Never check out a fork or the PR head in this privileged workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Select only the PR author
        id: author
        uses: actions/github-script@v7.0.1
        with:
          script: |
            await require('./.github/scripts/cla-author.cjs').prepare({ github, context, core });
      - name: CLA Assistant
        if: steps.author.outputs.run-action == 'true'
        # The final author check is authoritative even when the upstream action
        # cannot handle an un-attributed author, file initialization or rerun.
        continue-on-error: true
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          branch: cla-signatures
          allowlist: ${{ steps.author.outputs.allowlist }}
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: 'false'
      - name: Enforce the PR author signature
        if: always() && steps.author.outputs.run == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            await require('./.github/scripts/cla-author.cjs').verify({ github, context, core });
