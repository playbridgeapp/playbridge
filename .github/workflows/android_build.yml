name: Android Release Build

# Stage 2: signed packages → draft GitHub Releases.
# Stage 3: .github/workflows/android_publish.yml

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/android/**'
      - 'tv/android/**'
      - 'third_party/webrtc-runtime/**'
      - 'shared/**'
      - 'libs/**'
      - 'gradle/**'
      - 'protocol/**'
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile/android
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Get version
      id: version
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      run: |
        if git rev-parse "phone-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ phone-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 17
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_KEYSTORE_BASE64: ${{ secrets.PLAYBRIDGE_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        mkdir -p ../keystore
        echo "$PLAYBRIDGE_KEYSTORE_BASE64" | base64 -d > ../keystore/release.jks
        [ -s ../keystore/release.jks ] || { echo "ERROR: Keystore file is empty — PLAYBRIDGE_KEYSTORE_BASE64 secret may not be set"; exit 1; }

    - name: Grant execute permission for gradlew
      if: steps.check_tag.outputs.skipped == 'false'
      run: chmod +x gradlew

    # Distribution flavors: GitHub sideload releases ship the `foss` APKs
    # (self-update + all features); the Play Store gets the `play` AAB
    # (REQUEST_INSTALL_PACKAGES and self-update code stripped via the flavor —
    # no manifest sed hacks needed anymore).
    - name: Build Release APK (foss — GitHub sideload)
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew assembleFossRelease

    - name: Build Release AAB (play — Play Store)
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew bundlePlayRelease

    - name: Rename outputs
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        find app/build/outputs/apk/foss/release -name "*.apk" -type f | while read f; do
          mv "$f" "$(dirname "$f")/playbridge-phone-${{ steps.version.outputs.version }}-$(basename "$f")"
        done
        mv app/build/outputs/bundle/playRelease/app-play-release.aab \
           app/build/outputs/bundle/playRelease/playbridge-phone-${{ steps.version.outputs.version }}.aab

    - name: List outputs (Debug)
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        echo "APK outputs:"
        find app/build/outputs/apk/foss/release -maxdepth 2
        echo "Bundle outputs:"
        find app/build/outputs/bundle/playRelease -maxdepth 2

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp app/build/outputs/apk/foss/release/ \
          s3://${{ secrets.R2_BUCKET }}/phone-release-apk/ \
          --recursive --exclude "*" --include "*.apk"
        aws s3 cp app/build/outputs/bundle/playRelease/ \
          s3://${{ secrets.R2_BUCKET }}/phone-release-aab/ \
          --recursive --exclude "*" --include "*.aab"

  build-tv-player:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tv/android/player
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Get version
      id: version
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      run: |
        if git rev-parse "tv-player-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ tv-player-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 17
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_KEYSTORE_BASE64: ${{ secrets.PLAYBRIDGE_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        mkdir -p ../../keystore
        echo "$PLAYBRIDGE_KEYSTORE_BASE64" | base64 -d > ../../keystore/release.jks
        [ -s ../../keystore/release.jks ] || { echo "ERROR: Keystore file is empty — PLAYBRIDGE_KEYSTORE_BASE64 secret may not be set"; exit 1; }

    - name: Grant execute permission for gradlew
      if: steps.check_tag.outputs.skipped == 'false'
      run: chmod +x gradlew

    # Same flavor split as the phone job: foss APKs → GitHub, play AAB → Play Store.
    - name: Build Release APK (foss — GitHub sideload)
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew :player:app:assembleFossRelease

    - name: Build Release AAB (play — Play Store)
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew :player:app:bundlePlayRelease

    - name: Rename outputs
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        find app/build/outputs/apk/foss/release -name "*.apk" -type f | while read f; do
          mv "$f" "$(dirname "$f")/playbridge-tv-player-${{ steps.version.outputs.version }}-$(basename "$f")"
        done
        mv app/build/outputs/bundle/playRelease/app-play-release.aab \
           app/build/outputs/bundle/playRelease/playbridge-tv-player-${{ steps.version.outputs.version }}.aab

    - name: List outputs (Debug)
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        echo "APK outputs:"
        find app/build/outputs/apk/foss/release -maxdepth 2
        echo "Bundle outputs:"
        find app/build/outputs/bundle/playRelease -maxdepth 2

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp app/build/outputs/apk/foss/release/ \
          s3://${{ secrets.R2_BUCKET }}/tv-player-release-apk/ \
          --recursive --exclude "*" --include "*.apk"
        aws s3 cp app/build/outputs/bundle/playRelease/ \
          s3://${{ secrets.R2_BUCKET }}/tv-player-release-aab/ \
          --recursive --exclude "*" --include "*.aab"

  build-tv-geckoview-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tv/android/geckoview-plugin
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Get version
      id: version
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check tag
      id: check_tag
      run: |
        if git rev-parse "tv-geckoview-plugin-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ tv-geckoview-plugin-v${{ steps.version.outputs.version }} already exists, skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 17
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_KEYSTORE_BASE64: ${{ secrets.PLAYBRIDGE_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        mkdir -p ../../keystore
        echo "$PLAYBRIDGE_KEYSTORE_BASE64" | base64 -d > ../../keystore/release.jks
        [ -s ../../keystore/release.jks ] || { echo "ERROR: Keystore file is empty — PLAYBRIDGE_KEYSTORE_BASE64 secret may not be set"; exit 1; }

    - name: Grant execute permission for gradlew
      if: steps.check_tag.outputs.skipped == 'false'
      run: chmod +x gradlew

    - name: Build Release APK
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew :geckoview-plugin:app:assembleRelease

    - name: Build Release AAB
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        PLAYBRIDGE_STORE_PASSWORD: ${{ secrets.PLAYBRIDGE_STORE_PASSWORD }}
        PLAYBRIDGE_KEY_ALIAS: ${{ secrets.PLAYBRIDGE_KEY_ALIAS }}
        PLAYBRIDGE_KEY_PASSWORD: ${{ secrets.PLAYBRIDGE_KEY_PASSWORD }}
      run: ./gradlew :geckoview-plugin:app:bundleRelease

    - name: Rename outputs
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        # Rename APKs
        find app/build/outputs/apk/release -name "*.apk" -type f | while read f; do
          mv "$f" "$(dirname "$f")/playbridge-tv-geckoview-plugin-${{ steps.version.outputs.version }}-$(basename "$f")"
        done
        # Rename Bundles (AABs) - using find to be safer
        find app/build/outputs/bundle/release -name "*.aab" -type f | while read f; do
          mv "$f" "$(dirname "$f")/playbridge-tv-geckoview-plugin-${{ steps.version.outputs.version }}.aab"
        done

    - name: List outputs (Debug)
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        echo "APK outputs:"
        find app/build/outputs/apk/release -maxdepth 2
        echo "Bundle outputs:"
        find app/build/outputs/bundle/release -maxdepth 2

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp app/build/outputs/apk/release/ \
          s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-apk/ \
          --recursive --exclude "*" --include "*.apk"
        aws s3 cp app/build/outputs/bundle/release/ \
          s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-aab/ \
          --recursive --exclude "*" --include "*.aab"

  draft-release:
    needs: [build-phone, build-tv-player, build-tv-geckoview-plugin]
    if: |
      (success() || always()) &&
      (needs.build-phone.outputs.skipped == 'false' ||
       needs.build-tv-player.outputs.skipped == 'false' ||
       needs.build-tv-geckoview-plugin.outputs.skipped == 'false') &&
      (needs.build-phone.result != 'failure' &&
       needs.build-tv-player.result != 'failure' &&
       needs.build-tv-geckoview-plugin.result != 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download build artifacts from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          mkdir -p output
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/phone-release-apk/ output/phone-release-apk/
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/phone-release-aab/ output/phone-release-aab/
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/tv-player-release-apk/ output/tv-player-release-apk/
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/tv-player-release-aab/ output/tv-player-release-aab/
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-apk/ output/tv-geckoview-plugin-release-apk/
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-aab/ output/tv-geckoview-plugin-release-aab/

      - name: Get versions
        id: versions
        run: |
          PHONE=$(grep 'versionName =' mobile/android/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          PLAYER=$(grep 'versionName =' tv/android/player/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          BROWSER=$(grep 'versionName =' tv/android/geckoview-plugin/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "phone=$PHONE" >> $GITHUB_OUTPUT
          echo "player=$PLAYER" >> $GITHUB_OUTPUT
          echo "browser=$BROWSER" >> $GITHUB_OUTPUT

      - name: Create Phone draft release
        if: needs.build-phone.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-v${{ steps.versions.outputs.phone }}
          name: PlayBridge Phone v${{ steps.versions.outputs.phone }}
          draft: true
          body: |
            <!-- tag: 5c9b2f -->
            <!-- playbridge-rollout-delay-hours: 24 -->
            **Phone:** v${{ steps.versions.outputs.phone }}

            📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/phone-v${{ steps.versions.outputs.phone }}/mobile/android/CHANGELOG.md)

            > Download the `.apk` for your device's architecture (`arm64-v8a` for most modern devices) and sideload it.
          files: |
            output/phone-release-apk/*.apk
            output/phone-release-aab/*.aab
          generate_release_notes: false

      - name: Create TV Player draft release
        if: needs.build-tv-player.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-player-v${{ steps.versions.outputs.player }}
          name: PlayBridge TV Player v${{ steps.versions.outputs.player }}
          draft: true
          body: |
            <!-- tag: 8d2a1c -->
            <!-- playbridge-rollout-delay-hours: 24 -->
            **TV Player:** v${{ steps.versions.outputs.player }}

            📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/tv-player-v${{ steps.versions.outputs.player }}/tv/android/CHANGELOG.md)

            > 💡 **Easy Install on TV**: Open the **Downloader** app on your Android TV / Fire TV and enter code **`9557748`** to download and install this release directly.

            Or download the `.apk` below (universal APK is recommended) and sideload it manually.
          files: |
            output/tv-player-release-apk/*.apk
            output/tv-player-release-aab/*.aab
          generate_release_notes: false

      - name: Create TV GeckoView Plugin draft release
        if: needs.build-tv-geckoview-plugin.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-geckoview-plugin-v${{ steps.versions.outputs.browser }}
          name: PlayBridge TV GeckoView Plugin v${{ steps.versions.outputs.browser }}
          draft: true
          body: |
            <!-- tag: 3e7f9a -->
            <!-- playbridge-rollout-delay-hours: 24 -->
            **TV GeckoView Plugin:** v${{ steps.versions.outputs.browser }}

            📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/tv-geckoview-plugin-v${{ steps.versions.outputs.browser }}/tv/android/CHANGELOG.md)

            > Download the `.apk` for your device's architecture (`arm64-v8a` for most modern devices) and sideload it.
          files: |
            output/tv-geckoview-plugin-release-apk/*.apk
            output/tv-geckoview-plugin-release-aab/*.aab
          generate_release_notes: false

      - name: Clean up Android R2 staging
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/phone-release-apk/ --recursive
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/phone-release-aab/ --recursive
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/tv-player-release-apk/ --recursive
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/tv-player-release-aab/ --recursive
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-apk/ --recursive
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/tv-geckoview-plugin-release-aab/ --recursive
