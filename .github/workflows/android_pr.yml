name: Android PR Checks
# Two independent Gradle roots:
#   mobile/android -> PlayBridgePhone (:app, :shared)
#   tv/android     -> PlayBridgeTV    (:player:app, :browser:app, :shared)
# :shared is the KMP module at repo-root /shared, included by both roots.
# PR checks build the DEBUG variant only (auto-signed with the debug key),
# so no release keystore / secrets are required.
#
# Runs on every PR to main so the required `phone` / `tv` statuses always
# report, but the Gradle build only runs when android-relevant paths change
# (see the paths-filter step). On unrelated PRs each leg is a no-op pass.
# Release workflows call this with always_run before signing or publishing.

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      always_run:
        description: Run Gradle checks even when path filters do not match
        type: boolean
        default: false
      ref:
        description: Git ref to check out; empty uses the caller SHA
        type: string
        default: ""

# Only PR runs supersede each other. Release workflows call this workflow, so two
# releases on main would otherwise share a group and cancel each other's checks.
concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            dir: mobile/android
          - name: tv
            dir: tv/android
    name: ${{ matrix.name }}
    defaults:
      run:
        working-directory: ./${{ matrix.dir }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.always_run }}
        id: filter
        with:
          filters: |
            relevant:
              - 'mobile/android/**'
              - 'tv/android/**'
              - 'third_party/webrtc-runtime/**'
              - 'shared/**'
              - 'protocol/**'
              - 'gradle/**'
              - '.github/workflows/android_pr.yml'

      - name: Resolve check gate
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.always_run }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 17
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The phone project pins its Gradle daemon to JetBrains JDK 21
      # (gradle/gradle-daemon-jvm.properties). Install it here so Gradle does not
      # download it from the pinned foojay.io URL, which now returns 400.
      - name: Set up JetBrains JDK 21 for the Gradle daemon
        if: steps.gate.outputs.run == 'true' && matrix.name == 'phone'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Grant execute permission for gradlew
        if: steps.gate.outputs.run == 'true'
        run: chmod +x gradlew

      - name: Test GeckoView port disconnect guard
        if: steps.gate.outputs.run == 'true' && matrix.name == 'phone'
        run: ./gradlew -p buildSrc test --stacktrace

      # Blocking gate: compile all apps, run unit tests across every module
      # (including :shared's KMP host tests), and run Android Lint. Pre-existing
      # lint issues are recorded in per-module lint-baseline.xml files, so Lint
      # fails only on NEW issues a change introduces.
      - name: Assemble (debug), test & lint
        if: steps.gate.outputs.run == 'true'
        run: ./gradlew assembleDebug check --stacktrace
