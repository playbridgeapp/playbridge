name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/site/**'
      - 'cli/install.sh'
      - 'cli/install.ps1'
      - 'browser-receiver-rust/web/**'
      - '.github/workflows/web_deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/web_pr.yml
    with:
      always_run: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/site/pnpm-lock.yaml
            browser-receiver-rust/web/pnpm-lock.yaml

      - name: Install receiver dependencies
        working-directory: ./browser-receiver-rust/web
        run: pnpm install --frozen-lockfile

      - name: Test and build receiver assets
        working-directory: ./browser-receiver-rust/web
        run: pnpm test && pnpm build && pnpm check:generated

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, check, and build
        run: pnpm test && pnpm check && pnpm build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name playbridge --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
