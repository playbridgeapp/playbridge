name: Extension PR Checks
#
# Runs on every PR to main so the required `extension` status always reports,
# but the heavy build steps only execute when extension-relevant paths change
# (see the paths-filter step). On unrelated PRs the job is a fast no-op pass.
# Release workflows call this with always_run before signing or publishing.

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      always_run:
        description: Run extension checks even when path filters do not match
        type: boolean
        default: false
      ref:
        description: Git ref to check out; empty uses the caller SHA
        type: string
        default: ""

# Only PR runs supersede each other. Release workflows call this workflow, so two
# releases on main would otherwise share a group and cancel each other's checks.
concurrency:
  group: extension-pr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./extension
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.always_run }}
        id: filter
        with:
          filters: |
            relevant:
              - 'extension/**'
              - 'protocol/**'
              - '.github/workflows/extension_pr.yml'

      - name: Resolve check gate
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.always_run }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # esbuild (build) does NOT type-check, so do it explicitly.
      - name: Type check
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec tsc --noEmit

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: pnpm test

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: pnpm run build

      # Validate the built add-on the same way AMO will before the release
      # signing pipeline runs. The build emits dist/firefox + dist/chrome;
      # lint the Firefox build.
      - name: Lint extension (web-ext)
        if: steps.gate.outputs.run == 'true'
        run: npx --yes web-ext lint --source-dir dist/firefox
