name: Stream Proxy PR Checks

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      always_run:
        description: Run proxy checks even when path filters do not match
        type: boolean
        default: false
      ref:
        description: Git ref to check out; empty uses the caller SHA
        type: string
        default: ""

concurrency:
  group: stream-proxy-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: stream-proxy-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./stream-proxy-rust
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.always_run }}
        id: filter
        with:
          filters: |
            relevant:
              - 'stream-proxy-rust/**'
              - '.github/workflows/stream_proxy_pr.yml'

      - name: Resolve check gate
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.always_run }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust Toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./stream-proxy-rust

      - name: Run cargo test
        if: steps.gate.outputs.run == 'true'
        run: cargo test

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (dry-run)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./stream-proxy-rust
          file: ./stream-proxy-rust/Dockerfile
          push: false
