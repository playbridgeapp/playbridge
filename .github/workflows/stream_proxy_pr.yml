name: Stream Proxy PR Checks

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: stream-proxy-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: stream-proxy-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./stream-proxy-rust
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'stream-proxy-rust/**'
              - '.github/workflows/stream_proxy_pr.yml'

      - uses: actions/checkout@v4
        if: steps.filter.outputs.relevant == 'true'

      - name: Install Rust Toolchain
        if: steps.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: steps.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./stream-proxy-rust

      - name: Run cargo test
        if: steps.filter.outputs.relevant == 'true'
        run: cargo test

      - name: Set up Docker Buildx
        if: steps.filter.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run)
        if: steps.filter.outputs.relevant == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./stream-proxy-rust
          file: ./stream-proxy-rust/Dockerfile
          push: false
