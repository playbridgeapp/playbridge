name: Extension Build
# protocol submodule: playbridgeapp/playbridge-protocol

on:
  push:
    branches: [ "main" ]
    paths:
      - "extension/**"
      - ".github/workflows/extension_build.yml"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Get version
      id: version
      run: |
        VERSION=$(jq -r '.version' manifests/firefox.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check version status
      id: check_tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Try to get version from previous commit to check for bumps
        PREV_VERSION=$(git show HEAD^:extension/manifests/firefox.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "none")
        
        if git rev-parse "extension-v$VERSION" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ extension-v$VERSION already exists (tag found), skipping."
        elif [ "$VERSION" == "$PREV_VERSION" ]; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ Version $VERSION matches previous commit (no bump), skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up pnpm
      if: steps.check_tag.outputs.skipped == 'false'
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: extension/pnpm-lock.yaml

    - name: Run store check
      if: steps.check_tag.outputs.skipped == 'false'
      run: |
        pnpm install --frozen-lockfile
        pnpm run store:check

    - name: Upload to R2
      if: steps.check_tag.outputs.skipped == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: |
        aws s3 cp artifacts/ \
          s3://${{ secrets.R2_BUCKET }}/extension-release/ \
          --recursive

    - name: Upload workflow artifacts
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: playbridge-extension-artifacts-${{ steps.version.outputs.version }}
        path: extension/artifacts/
        if-no-files-found: error
        retention-days: 90

  release:
    needs: build-extension
    if: needs.build-extension.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' extension/manifests/firefox.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          mkdir -p output
          aws s3 sync s3://${{ secrets.R2_BUCKET }}/extension-release/ output/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: extension-v${{ steps.version.outputs.version }}
          name: PlayBridge Extension v${{ steps.version.outputs.version }}
          body: |
            <!-- tag: 9f2d8e -->
            **PlayBridge Extension:** v${{ steps.version.outputs.version }}

            | Browser / Target | File | Action |
            |------------------|------|--------|
            | Firefox | `playbridge-extension-firefox-${{ steps.version.outputs.version }}.zip` | Submit to Firefox Add-ons (AMO) Developer Hub (Listed) |
            | Chrome / Edge / Brave | `playbridge-extension-chrome-${{ steps.version.outputs.version }}.zip` | Upload to Chrome Web Store Developer Dashboard |
            | Firefox Source Code | `playbridge-extension-source-${{ steps.version.outputs.version }}.zip` | Upload to Firefox AMO as the source package for review |
            | Checksums | `SHA256SUMS.txt` | Verify integrity of released artifacts |
          files: output/*
          generate_release_notes: false

      - name: Clean up R2 after release
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 rm s3://${{ secrets.R2_BUCKET }}/extension-release/ --recursive
