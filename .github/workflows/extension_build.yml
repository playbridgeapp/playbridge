name: Extension Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "extension/**"
      - ".github/workflows/extension_build.yml"
  workflow_dispatch:

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/extension_pr.yml
    with:
      always_run: true

  build-extension:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        VERSION=$(jq -r '.version' manifests/firefox.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check version status
      id: check_tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Try to get version from previous commit to check for bumps
        PREV_VERSION=$(git show HEAD^:extension/manifests/firefox.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "none")
        
        if git rev-parse "extension-v$VERSION" >/dev/null 2>&1; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ extension-v$VERSION already exists (tag found), skipping."
        elif [ "$VERSION" == "$PREV_VERSION" ]; then
          echo "skipped=true" >> $GITHUB_OUTPUT
          echo "⏭️ Version $VERSION matches previous commit (no bump), skipping."
        else
          echo "skipped=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up pnpm
      if: steps.check_tag.outputs.skipped == 'false'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 9

    - name: Set up Node
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: extension/pnpm-lock.yaml

    - name: Install dependencies
      if: steps.check_tag.outputs.skipped == 'false'
      run: pnpm install --frozen-lockfile

    # Typecheck, tests, Firefox/Chrome builds, store validation, zero-warning
    # Firefox lint and deterministic store packages + SHA256SUMS.txt in
    # extension/artifacts/. The store jobs below submit exactly these files.
    - name: Store check and package
      if: steps.check_tag.outputs.skipped == 'false'
      run: pnpm store:check

    - name: Upload store artifacts
      if: steps.check_tag.outputs.skipped == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: extension-store-artifacts
        path: |
          extension/artifacts/*.zip
          extension/artifacts/SHA256SUMS.txt
        if-no-files-found: error

  release:
    needs: build-extension
    if: needs.build-extension.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download store artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-store-artifacts
          path: output

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: extension-v${{ needs.build-extension.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PlayBridge Extension v${{ needs.build-extension.outputs.version }}
          body: |
            <!-- tag: 9f2d8e -->
            <!-- playbridge-rollout-delay-hours: 24 -->
            **PlayBridge Extension:** v${{ needs.build-extension.outputs.version }}

            📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/extension-v${{ needs.build-extension.outputs.version }}/extension/CHANGELOG.md)

            Install from the stores to get automatic updates. This version was submitted to both stores and appears there once review finishes.

            | Browser | Install |
            |---------|---------|
            | Firefox | [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/playbridge-video-detector/) |
            | Chrome / Edge / Brave | [Chrome Web Store](https://chromewebstore.google.com/detail/playbridge-video-detector/gofdcnocpnieoonficfnfccolcocoaim) |

            The attached zips are the exact packages submitted to the stores, plus the source archive provided to Mozilla and `SHA256SUMS.txt`. The Firefox zip is unsigned (for `about:debugging` only); the Chrome zip can be loaded unpacked from `chrome://extensions` in Developer mode.
          files: output/*
          generate_release_notes: false

  # Submits the version to the public AMO listing. AMO version numbers are
  # unique across channels, so CI no longer signs a self-distributed copy.
  submit-firefox:
    needs: [build-extension, release]
    if: needs.build-extension.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download store artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-store-artifacts
          path: artifacts

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Submit to addons.mozilla.org
        env:
          VERSION: ${{ needs.build-extension.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET secrets are not configured."
            exit 1
          fi
          # Sign exactly the package attached to the release.
          mkdir firefox
          unzip -q "artifacts/playbridge-extension-firefox-$VERSION.zip" -d firefox
          # The bundled scripts are generated, so Mozilla requires the source
          # archive. --approval-timeout 0 returns once the version is submitted;
          # review continues on AMO.
          npx --yes web-ext@10.7.0 sign \
            --channel listed \
            --source-dir firefox \
            --artifacts-dir web-ext-artifacts \
            --upload-source-code "artifacts/playbridge-extension-source-$VERSION.zip" \
            --approval-timeout 0

  # Uploads to the Chrome Web Store and submits for review; Google publishes
  # automatically once the review passes.
  submit-chrome:
    needs: [build-extension, release]
    if: needs.build-extension.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download store artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-store-artifacts
          path: artifacts

      - name: Submit to the Chrome Web Store
        env:
          VERSION: ${{ needs.build-extension.outputs.version }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: gofdcnocpnieoonficfnfccolcocoaim
        run: |
          set -euo pipefail
          for name in CWS_SERVICE_ACCOUNT_JSON CWS_PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not configured."
              exit 1
            fi
          done

          # Service-account JWT exchanged for an access token. The account
          # must be added under Account in the Chrome Web Store dashboard.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          email=$(jq -r '.client_email' <<<"$CWS_SERVICE_ACCOUNT_JSON")
          key_file=$(umask 077 && mktemp)
          trap 'rm -f "$key_file"' EXIT
          jq -r '.private_key' <<<"$CWS_SERVICE_ACCOUNT_JSON" > "$key_file"
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          claims=$(jq -nc --arg iss "$email" --argjson iat "$now" --argjson exp "$((now + 600))" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/chromewebstore", aud: "https://oauth2.googleapis.com/token", iat: $iat, exp: $exp}' | b64url)
          signature=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key_file" | b64url)
          rm -f "$key_file"
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$header.$claims.$signature" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Could not get a Chrome Web Store access token."
            exit 1
          fi
          echo "::add-mask::$token"

          item="https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID"
          upload="https://chromewebstore.googleapis.com/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID:upload"
          auth="Authorization: Bearer $token"

          # Do not use curl -f here: the error body explains a rejected upload.
          response=$(curl -sS -X POST -H "$auth" \
            -H "Content-Type: application/zip" \
            --data-binary "@artifacts/playbridge-extension-chrome-$VERSION.zip" \
            "$upload")
          echo "Upload response: $response"
          state=$(jq -r '.uploadState // empty' <<<"$response")

          for _ in $(seq 1 30); do
            case "$state" in
              IN_PROGRESS|UPLOAD_IN_PROGRESS) ;;
              *) break ;;
            esac
            sleep 10
            status=$(curl -sS -H "$auth" "$item:fetchStatus")
            state=$(jq -r '.lastAsyncUploadState // empty' <<<"$status")
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not succeed (state: ${state:-unknown})."
            exit 1
          fi

          response=$(curl -sS -X POST -H "$auth" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "$item:publish")
          echo "Publish response: $response"
          if [ -z "$(jq -r '.state // empty' <<<"$response")" ]; then
            echo "::error::Chrome Web Store did not accept the submission."
            exit 1
          fi
