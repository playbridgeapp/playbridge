name: CLI Publish

# Stage 3: promote an existing draft cli-v* GitHub Release (no rebuild).
# Stage 2: .github/workflows/cli_build.yml

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to publish (e.g. 0.1.1 or cli-v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: validate draft release
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.release.outputs.is_draft }}
      tag: ${{ steps.release.outputs.tag }}
      test_ref: ${{ steps.release.outputs.test_ref }}
    steps:
      - name: Find draft GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#cli-v}"
          test -n "$VERSION"
          TAG="cli-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if ! gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,targetCommitish,url >/tmp/cli-release.json; then
            echo "No GitHub Release found for $TAG." >&2
            echo "Run CLI Release Build first (uprev or workflow_dispatch)." >&2
            exit 1
          fi

          is_draft=$(jq -r '.isDraft' /tmp/cli-release.json)
          url=$(jq -r '.url' /tmp/cli-release.json)
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          if [ "$is_draft" = "false" ]; then
            echo "⏭️ $TAG is already published: $url"
            exit 0
          fi
          echo "✅ Found draft $TAG: $url"

          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --method GET --silent >/dev/null 2>&1; then
            TEST_REF="$TAG"
          else
            TARGET=$(jq -r '.targetCommitish' /tmp/cli-release.json)
            if [[ ! "$TARGET" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Draft $TAG has no remote tag and targetCommitish '$TARGET' is not a full 40-hex commit SHA." >&2
              echo "Pin it with: gh release edit $TAG --repo $REPOSITORY --target <sha>, or rebuild the draft." >&2
              exit 1
            fi
            TEST_REF="$TARGET"
          fi
          echo "test_ref=$TEST_REF" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: validate
    if: needs.validate.outputs.is_draft == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust_pr.yml
    with:
      ref: ${{ needs.validate.outputs.test_ref }}

  publish:
    name: publish draft release
    needs: [validate, test]
    if: needs.validate.outputs.is_draft == 'true'
    runs-on: ubuntu-latest
    # Optional: add environment: cli-release with required reviewers in repo settings.
    steps:
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#cli-v}"
          test -n "$VERSION"
          TAG="cli-v${VERSION}"

          if ! gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,url >/tmp/cli-release.json; then
            echo "No GitHub Release found for $TAG." >&2
            echo "Run CLI Release Build first (uprev or workflow_dispatch)." >&2
            exit 1
          fi

          is_draft=$(jq -r '.isDraft' /tmp/cli-release.json)
          url=$(jq -r '.url' /tmp/cli-release.json)

          if [ "$is_draft" = "false" ]; then
            echo "⏭️ $TAG is already published: $url"
            exit 0
          fi

          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
          echo "Published $TAG"
          gh release view "$TAG" --repo "$REPOSITORY" --json url,isDraft,tagName
