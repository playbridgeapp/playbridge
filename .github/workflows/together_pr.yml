name: Watch Together Workers PR Checks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'together/**'
      - '.github/workflows/together_pr.yml'
  workflow_dispatch:

concurrency:
  group: together-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: together
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./together
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: together/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Worker tests
        run: pnpm test
