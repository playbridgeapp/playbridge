name: Rust PR Checks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'cast/**'
      - 'cli/**'
      - 'browser-receiver-rust/**'
      - 'stream-proxy-rust/**'
      - '.github/workflows/rust_pr.yml'
      - '.github/workflows/cli_build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; empty uses the caller SHA
        type: string
        default: ""
      include_cli_builds:
        description: Also compile the CLI on Linux, macOS, and Windows
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate CLI installer
        run: sh -n cli/install.sh

      - name: Validate Windows CLI installer
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw cli/install.ps1)) | Out-Null'

  cli-build:
    name: cli-${{ matrix.os }}
    if: ${{ inputs.include_cli_builds != false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Build CLI
        run: cargo build --release --locked -p playbridge-cast-cli

      - name: Test Windows installer helpers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./cli/install.tests.ps1
