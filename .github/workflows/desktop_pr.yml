name: Desktop PR Checks
# Flutter (libmpv/media_kit) desktop receiver.
# Analyze + test run on a single Linux runner without native builds;
# the cross-platform release build stays in desktop_build.yml.
#
# Runs on every PR to main so the required `desktop` status always reports,
# but the heavy Flutter steps only execute when desktop-relevant paths change
# (see the paths-filter step). On unrelated PRs the job is a fast no-op pass.

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: desktop-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'desktop/**'
              - 'packages/playbridge_cast_core_dart/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cast/**'
              - 'cli/**'
              - 'protocol/**'
              - '.gitmodules'
              - '.github/workflows/desktop_pr.yml'

      - uses: actions/checkout@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        if: steps.filter.outputs.relevant == 'true'
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        if: steps.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: flutter pub get

      - name: Install Cast Core Dart dependencies
        if: steps.filter.outputs.relevant == 'true'
        working-directory: ./packages/playbridge_cast_core_dart
        run: dart pub get

      - name: Verify formatting
        if: steps.filter.outputs.relevant == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Cast Core Dart formatting
        if: steps.filter.outputs.relevant == 'true'
        working-directory: ./packages/playbridge_cast_core_dart
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.filter.outputs.relevant == 'true'
        run: flutter analyze

      - name: Analyze Cast Core Dart package
        if: steps.filter.outputs.relevant == 'true'
        working-directory: ./packages/playbridge_cast_core_dart
        run: dart analyze --fatal-infos

      - name: Build native Rust FFI library
        if: steps.filter.outputs.relevant == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cargo build --manifest-path Cargo.toml --package playbridge-cast-core-ffi --features playbridge-cast-core-ffi/sender-services
          mkdir -p desktop/native/cast_core/linux
          cp target/debug/libplaybridge_cast_core_ffi.so desktop/native/cast_core/linux/

      - name: Run tests
        if: steps.filter.outputs.relevant == 'true'
        run: flutter test

      - name: Test Cast Core Dart package
        if: steps.filter.outputs.relevant == 'true'
        working-directory: ./packages/playbridge_cast_core_dart
        run: dart test

      - name: Verify Rust formatting
        if: steps.filter.outputs.relevant == 'true'
        working-directory: .
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        if: steps.filter.outputs.relevant == 'true'
        working-directory: .
        run: cargo test --workspace --all-targets

      - name: Lint Rust workspace
        if: steps.filter.outputs.relevant == 'true'
        working-directory: .
        run: cargo clippy --workspace --all-targets -- -D warnings
