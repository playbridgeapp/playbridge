name: CLI Build & Release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "cli-v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate installer
        run: sh -n cli/install.sh

  build:
    name: ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: playbridge-cli-linux-x86_64
            binary: playbridge
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: playbridge-cli-linux-aarch64
            binary: playbridge
          - os: macos-13
            target: x86_64-apple-darwin
            asset: playbridge-cli-macos-x86_64
            binary: playbridge
          - os: macos-14
            target: aarch64-apple-darwin
            asset: playbridge-cli-macos-aarch64
            binary: playbridge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: playbridge-cli-windows-x86_64
            binary: playbridge.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked -p playbridge-cast-cli --target ${{ matrix.target }}

      - name: Package CLI
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp LICENSE package/
          tar -czf "${{ matrix.asset }}.tar.gz" -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    name: publish CLI release
    needs: [validate, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: playbridge-cli-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PlayBridge CLI v${{ needs.validate.outputs.version }}
          body: |
            Cross-platform PlayBridge sender and receiver CLI.

            Install on macOS or Linux:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/playbridgeapp/playbridge/main/cli/install.sh | sh
            ```

            Receiver mode requires `mpv` to be installed.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
