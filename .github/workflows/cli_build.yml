name: CLI Build & Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cli/**'
      - 'cast/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cli_build.yml'
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check_tag.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: check_tag
        run: |
          if git rev-parse "cli-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ cli-v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate installer
        if: steps.check_tag.outputs.skipped == 'false'
        run: sh -n cli/install.sh

  build:
    name: ${{ matrix.asset }}
    needs: validate
    if: needs.validate.outputs.skipped == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: playbridge-cli-linux-x86_64
            binary: playbridge
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: playbridge-cli-linux-aarch64
            binary: playbridge
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: playbridge-cli-macos-x86_64
            binary: playbridge
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: playbridge-cli-macos-aarch64
            binary: playbridge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: playbridge-cli-windows-x86_64
            binary: playbridge.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked -p playbridge-cast-cli --target ${{ matrix.target }}

      - name: Package CLI
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp LICENSE package/
          tar -czf "${{ matrix.asset }}.tar.gz" -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    name: publish CLI release
    needs: [validate, build]
    if: needs.validate.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: playbridge-cli-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ needs.validate.outputs.version }}
          name: PlayBridge CLI v${{ needs.validate.outputs.version }}
          body: |
            <!-- tag: 7b2c9a -->
            **CLI:** v${{ needs.validate.outputs.version }}

            📋 [Changelog](https://github.com/playbridgeapp/playbridge/blob/cli-v${{ needs.validate.outputs.version }}/cli/CHANGELOG.md)

            Cross-platform PlayBridge sender and receiver CLI.

            **Installation (macOS & Linux):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/playbridgeapp/playbridge/main/cli/install.sh | sh
            ```

            Receiver mode requires `mpv` to be installed (`brew install mpv` or `sudo apt install mpv`).
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: false
