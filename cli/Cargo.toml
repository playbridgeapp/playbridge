[package]
name = "playbridge-cast-cli"
version = "0.2.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Cross-platform command-line client for PlayBridge Cast Core"

[[bin]]
name = "playbridge"
path = "src/main.rs"

[dependencies]
playbridge-cast-core = { path = "../cast/core" }
playbridge-cast-receiver = { path = "../cast/receiver" }
playbridge-browser-receiver = { path = "../browser-receiver-rust" }
stream-proxy-rust = { path = "../stream-proxy-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
crossterm = "0.28"
ratatui = "0.29"
toml = "0.8"
unicode-width = "0.2"
getrandom = "0.4"
base64 = "0.22"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
mdns-sd = { version = "0.20", default-features = false, features = ["async"] }
rcgen = "0.14"
rustls = "0.23"
sha2 = "0.10"
tokio-rustls = "0.26"
tokio-tungstenite = "0.28"
x509-parser = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
semver = "1"
tempfile = "3"
