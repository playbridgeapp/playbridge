name: playbridge_desktop
description: "PlayBridge desktop receiver — accepts cast commands from the phone and plays via libmpv."
publish_to: 'none'
version: 0.6.8+26

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # WebSocket server (matches phone's expected port 8765, JSON envelope)
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1

  # libmpv-backed player + video surface (cross-platform: macOS, Windows, Linux)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  video_player: ^2.9.2

  # PlayBridge protocol — generated protobuf types
  playbridge_protocol:
    path: ../protocol/generated/dart

  # mDNS service publishing (_playbridge._tcp.) + persistent pairing
  bonsoir: ^5.1.10
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # Self-signed TLS identity for wss:// (see ../WSS_MIGRATION_PLAN.md).
  # basic_utils generates the cert+key (re-exports pointycastle types);
  # crypto hashes the SPKI pin.
  basic_utils: ^5.7.0
  crypto: ^3.0.3
  # ASN.1 parsing for the sender-side SPKI pin (tv_sender_client.dart). Transitive
  # via basic_utils, pinned directly because we import pointycastle/asn1.dart.
  pointycastle: ^3.9.1

  # Service-like behavior: tray icon + programmatic window control.
  # Launch-at-login is implemented in lib/auto_launch.dart (no plugin).
  tray_manager: ^0.5.1
  window_manager: ^0.4.3
  path_provider: ^2.1.5

  # Native file picker for the "Cast a file" action (desktop sender).
  file_selector: ^1.0.3

  # Drag-and-drop of local files onto the Send to TV screen (→ playlist).
  desktop_drop: ^0.5.0
  x25519: ^0.1.1
  flutter_media_session: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    # The native-messaging host binary, bundled so `flutter build` carries it and
    # the app can register it with browsers. Compile it via scripts/build_host.sh
    # before building. Empty in a fresh checkout (the app falls back to build/).
    - assets/host/
  # Brand font shared with the Android apps (Poppins). Single static weight;
  # Flutter synthesizes heavier weights from it.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
