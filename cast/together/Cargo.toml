[package]
name = "playbridge-together"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MPL-2.0"
description = "PlayBridge Watch Together room engine: clock sync, playback sync and end-to-end encryption"

[dependencies]
aes-gcm = "0.11"
base64 = "0.22"
ed25519-dalek = "3"
futures-util = "0.3"
getrandom = "0.4"
hkdf = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
