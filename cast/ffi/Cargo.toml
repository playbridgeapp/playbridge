[package]
name = "playbridge-cast-core-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MPL-2.0"
description = "UniFFI and stable C bindings for PlayBridge Cast Core"

[features]
default = []
adblock-engine = ["playbridge-cast-core/adblock-engine"]
# The sender-hosted web receiver beside the embedded proxy.
browser-receiver = ["dep:playbridge-browser-receiver"]
# Desktop / Docker-style embed: reqwest (+ AVIO) origin fetch.
sender-services = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-reqwest",
    "stream-proxy-rust/upstream-avio",
]
# Android phone embed: host HttpURLConnection via JNI callbacks (no reqwest).
sender-services-android = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]

# Apple phone embed: host URLSession via the same platform-neutral C callbacks.
sender-services-apple = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]

# Apple TV receiver embed: the proxy alone (no browser receiver, no adblock), so
# page-controlled media is fetched through URLSession callbacks under the proxy's
# network policy.
receiver-proxy-apple = [
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
playbridge-cast-core = { path = "../core" }
playbridge-cast-receiver = { path = "../receiver" }
playbridge-browser-receiver = { path = "../../browser-receiver-rust", optional = true }
# Features selected by the sender-services variants (no default features).
stream-proxy-rust = { path = "../../stream-proxy-rust", optional = true, default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
thiserror = "2"
uniffi = "0.32"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
wiremock = "0.6"
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"
x509-parser = "0.18"
