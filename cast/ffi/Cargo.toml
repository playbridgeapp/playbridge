[package]
name = "playbridge-cast-core-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MPL-2.0"
description = "UniFFI and stable C bindings for PlayBridge Cast Core"

[features]
default = ["cast-core"]
cast-core = [
    "dep:playbridge-cast-core",
    "dep:playbridge-cast-receiver",
    "dep:base64",
    "dep:thiserror",
    "dep:uniffi",
    "dep:url",
]
browser-receiver = [
    "dep:playbridge-browser-receiver",
    "dep:playbridge-cast-core",
]
adblock-engine = ["cast-core", "playbridge-cast-core/adblock-engine"]
# Desktop / Docker-style embed: reqwest (+ AVIO) origin fetch.
sender-services = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-reqwest",
    "stream-proxy-rust/upstream-avio",
]
# Android phone embed: host HttpURLConnection via JNI callbacks (no reqwest).
sender-services-android = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]

# Apple phone embed: host URLSession via the same platform-neutral C callbacks.
sender-services-apple = [
    "browser-receiver",
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]
# Android TV receiver embed: loopback stream proxy + JNI upstream only (no cast-core or browser receiver).
receiver-proxy-android = [
    "dep:stream-proxy-rust",
    "stream-proxy-rust/upstream-jni",
]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
playbridge-cast-core = { path = "../core", optional = true }
playbridge-cast-receiver = { path = "../receiver", optional = true }
playbridge-browser-receiver = { path = "../../browser-receiver-rust", optional = true }
# Features selected by the sender-services / receiver-proxy variants (no default features).
stream-proxy-rust = { path = "../../stream-proxy-rust", optional = true, default-features = false }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
thiserror = { version = "2", optional = true }
uniffi = { version = "0.32", optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
wiremock = "0.6"
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"
x509-parser = "0.18"
